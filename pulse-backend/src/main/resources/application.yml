server:
  port: 8080
  servlet:
    context-path: /
  # SSL Configuration (enable for production to secure API Key transmission)
  # Generate keystore: keytool -genkeypair -alias pulse -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore keystore.p12 -validity 365
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: keystore.p12
    # No default: enabling SSL without providing the password must fail loudly.
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: pulse

spring:
  application:
    name: pulse-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pulse_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # Mandatory injection: startup fails when DB_PASSWORD is not provided.
    password: ${DB_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # Never StdOutImpl here: this is the base config, so every deployment that
    # forgets --spring.profiles.active=prod would dump password hashes, encrypted
    # API keys and all business data to stdout, bypassing the logging framework.
    # The dev profile turns SQL logging back on through slf4j.
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT Configuration
# No default value on purpose: a secret committed to the repo is a public secret.
# Startup fails when JWT_SECRET is missing (see SecretsValidator).
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds
  header: Authorization
  prefix: "Bearer "

# AES Encryption Configuration for API Key Storage
# AES_SECRET_LEGACY is only read to decrypt rows written before the GCM migration.
aes:
  secret-key: ${AES_SECRET}
  legacy-secret-key: ${AES_SECRET_LEGACY:}

# Python AI Side Gateway Configuration
pulse-ai-side:
  base-url: http://localhost:8000  # Python AI gateway URL
  # Read timeout for gateway calls. Must stay above the gateway's own worst-case
  # budget (per-attempt timeout x attempts + backoff) so its structured fallback
  # is what we observe instead of a client-side abort.
  timeout: 45000
  # Shared secret sent as X-Service-Token; the gateway rejects calls without it.
  service-token: ${SERVICE_TOKEN:}

# Daily Hot News Configuration
hot-news:
  ingest-token: ${HERMES_INGEST_TOKEN}
  cache-ttl-hours: ${HOT_NEWS_CACHE_TTL_HOURS:48}

# Agent Loop Scheduler Configuration
scheduler:
  agent-loop:
    enabled: true
    interval: 43200000  # 12 hours in milliseconds (12 * 60 * 60 * 1000)
    batch-size: 10    # Number of agents to process per cycle

  # Ranking Scheduler Configuration
  ranking:
    enabled: true

# Actuator: health endpoint only, used by the deploy pipeline to verify a restart
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Logging Configuration
logging:
  level:
    com.pulse: INFO
    org.springframework.security: WARN
