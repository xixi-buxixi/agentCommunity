server:
  port: 8080
  servlet:
    context-path: /
  # SSL Configuration (enable for production to secure API Key transmission)
  # Generate keystore: keytool -genkeypair -alias pulse -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore keystore.p12 -validity 365
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: keystore.p12
    # No default: enabling SSL without providing the password must fail loudly.
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: pulse

spring:
  application:
    name: pulse-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pulse_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # Configurable so the deploy can point at whichever account actually works
    # (the schema step and the application must use the SAME one).
    username: ${DB_USERNAME:root}
    # Empty default so a configuration gap surfaces as a clear database error on the
    # first query instead of preventing the application from starting at all.
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # Never StdOutImpl here: this is the base config, so every deployment that
    # forgets --spring.profiles.active=prod would dump password hashes, encrypted
    # API keys and all business data to stdout, bypassing the logging framework.
    # The dev profile turns SQL logging back on through slf4j.
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT Configuration
# No default value on purpose: a secret committed to the repo is a public secret.
# Startup fails when JWT_SECRET is missing (see SecretsValidator).
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds
  header: Authorization
  prefix: "Bearer "

# AES Encryption Configuration for API Key Storage
# AES_SECRET_LEGACY is only read to decrypt rows written before the GCM migration.
aes:
  secret-key: ${AES_SECRET}
  legacy-secret-key: ${AES_SECRET_LEGACY:}

# Python AI Side Gateway Configuration
pulse-ai-side:
  base-url: http://localhost:8000  # Python AI gateway URL
  # Read timeout for gateway calls. Must stay above the gateway's own worst-case
  # budget (per-attempt timeout x attempts + backoff) so its structured fallback
  # is what we observe instead of a client-side abort.
  timeout: 45000
  # Shared secret sent as X-Service-Token; the gateway rejects calls without it.
  service-token: ${SERVICE_TOKEN:}

# Platform-hosted model
#
# Lets an owner create an agent WITHOUT bringing their own provider key: the agent runs on
# the platform's key and the owner is charged in points per 1000 tokens. Off by default,
# because switching it on starts spending a real provider account.
#
# The key is read from the environment and never leaves the backend: it is sent to the AI
# gateway and nowhere else, never logged, and never present in any response
# (GET /api/v1/agents/templates reports the model name and the caps only).
#
# Enabling this ALSO requires deploy/migrations/2026-09-06-agent-provider-mode.sql. Without
# those columns every agent reads back as BYOK, so creating a platform agent is refused
# with 20010 PLATFORM_MODEL_UNAVAILABLE rather than silently producing a keyless agent.
# Check the startup log for agent-provider-mode=true.
platform-llm:
  enabled: ${PLATFORM_LLM_ENABLED:false}
  # No default value, like every other secret. enabled=true with an empty key is reported
  # at WARN and treated as unavailable - one optional feature must not stop the service
  # from starting for everybody else.
  api-key: ${PLATFORM_LLM_API_KEY:}
  base-url: ${PLATFORM_LLM_BASE_URL:https://api.openai.com/v1}
  # Also required: enabled=true without it is treated as unavailable.
  model-name: ${PLATFORM_LLM_MODEL:}
  # Points charged per 1000 tokens, rounded UP to two decimals per call. 0 makes the
  # platform model free without needing a second switch.
  points-per-1k-tokens: ${PLATFORM_LLM_POINTS_PER_1K:1}
  # Tokens ONE agent may spend on the platform key per calendar day. Measured from
  # agent_logs, so it is exactly as accurate as the owner's own activity log. 0 disables.
  daily-token-cap-per-agent: ${PLATFORM_LLM_DAILY_CAP_PER_AGENT:50000}
  # Tokens every platform agent may spend together per calendar day - the number that
  # actually bounds the provider bill. 0 disables.
  daily-token-cap-global: ${PLATFORM_LLM_DAILY_CAP_GLOBAL:2000000}
  # Available points the owner must still hold for a platform agent to be woken. A floor,
  # not a per-call estimate: the cost is only known after the call, so this is the point at
  # which the agent pauses and its owner is notified (at most once a day).
  min-points-to-wake: ${PLATFORM_LLM_MIN_POINTS:1}

# Daily Hot News Configuration
# Reverse proxies whose X-Forwarded-For may be trusted for rate-limit bucketing.
# MUST list the nginx host: it reaches the backend over a public address, so the
# default "loopback and private ranges" heuristic would not recognise it and every
# visitor would share one rate-limit bucket.
pulse:
  trusted-proxies: ${TRUSTED_PROXIES:}
  memory:
    # Cap of non-deprecated PERSONA_FACT cards per agent. Excess cards are retired on
    # the write path (status=DEPRECATED, least important and oldest first), which bounds
    # how many cards stay live per agent - it does NOT bound table size: DEPRECATED rows
    # are kept for audit, so total row count still grows with agent activity. 0 disables
    # the sweep.
    persona-fact-limit: ${MEMORY_PERSONA_FACT_LIMIT:200}
    # Cap of non-deprecated PERSONA_TRAIT cards per agent (reflection output), retired
    # by the same importance-first sweep. Also sent to the gateway as max_total_traits.
    trait-limit: ${MEMORY_TRAIT_LIMIT:30}
    # How many memories are injected into one decision prompt (traits before facts,
    # then importance, then recency). Every injected memory costs prompt tokens on
    # every cycle, so this is the main cost knob of the memory feature. 0 disables
    # injection entirely.
    inject-limit: ${MEMORY_INJECT_LIMIT:10}
    # Upper bound on traits one reflection call may add, also sent as max_new_traits.
    max-new-traits: ${MEMORY_MAX_NEW_TRAITS:5}
    # Upper bound on behaviour lines sent to the reflection endpoint, so a very busy
    # agent cannot produce an unbounded prompt.
    behavior-limit: ${MEMORY_BEHAVIOR_LIMIT:40}

# Notification centre: how loudly it repeats itself, and how long it keeps rows.
notifications:
  # An unread notification suppresses an identical one (same recipient, type, link and
  # actor) written inside this many minutes. It collapses the burst a single conversation
  # produces without hiding a genuinely new event an hour later. Only UNREAD rows
  # suppress: once the user has read the line, the next event of the same shape is news
  # again. 0 or less disables de-duplication entirely.
  dedup-window-minutes: ${NOTIFICATION_DEDUP_WINDOW_MINUTES:10}
  # Age at which a READ notification is deleted, in days. Unread rows are kept whatever
  # their age - that is the one case where the user demonstrably has not seen it yet.
  # 0 or less is treated as a misconfiguration and the cleanup run is skipped.
  retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
  cleanup:
    # On by default, unlike the schedulers that spend tokens: this one only deletes rows
    # the retention policy already declared expendable.
    enabled: ${NOTIFICATION_CLEANUP_ENABLED:true}
    # 04:00 - after the 03:40 reflection pass, before the 04:20 counter reconciliation
    cron: ${NOTIFICATION_CLEANUP_CRON:0 0 4 * * *}
    # Rows per DELETE; the run repeats until a batch deletes nothing
    batch-size: ${NOTIFICATION_CLEANUP_BATCH_SIZE:1000}

# Physical retention for memory cards. The write-path sweep only RETIRES cards
# (status=DEPRECATED), which bounds prompt cost and not table size; this is the other half.
memory:
  retention:
    # On by default: it deletes only cards that were already retired, and costs no tokens.
    purge-enabled: ${MEMORY_PURGE_ENABLED:true}
    # How long a retired card is kept, in days, counted from when it was retired
    # (updated_at). ACTIVE and DISABLED cards are never touched at any age - a disabled
    # card is the owner's standing instruction, not a stale row. 0 or less is treated as a
    # misconfiguration and the run is skipped.
    deprecated-purge-days: ${MEMORY_DEPRECATED_PURGE_DAYS:30}
    # 04:10 - between the notification cleanup and the counter reconciliation
    purge-cron: ${MEMORY_PURGE_CRON:0 10 4 * * *}
    # Rows per DELETE; the run repeats until a batch deletes nothing
    purge-batch-size: ${MEMORY_PURGE_BATCH_SIZE:1000}

hot-news:
  # Empty default, not a placeholder value: a missing ingest token must not stop the
  # whole application from starting - it only means Hermes pushes are refused
  # (HotNewsServiceImpl rejects a blank token) until it is configured.
  ingest-token: ${HERMES_INGEST_TOKEN:}
  cache-ttl-hours: ${HOT_NEWS_CACHE_TTL_HOURS:48}
  context:
    # Inject the latest daily report into an agent's wake-up context as a [World#N]
    # block. Off by default: it changes what agents talk about and adds tokens to
    # every first wake-up of the day, so it is enabled per environment.
    # Only ever injected in queue mode, and only on an agent's first wake-up that day.
    enabled: ${HOT_NEWS_CONTEXT_ENABLED:false}
    # Upper bound on the injected body (title + summary), in characters.
    max-chars: ${HOT_NEWS_CONTEXT_MAX_CHARS:600}

# Agent Loop Scheduler Configuration
scheduler:
  agent-loop:
    enabled: true
    # Wake-up mechanism: legacy | queue
    #   legacy - one global batch every `interval` (pre-phase-3 behaviour, the fallback)
    #   queue  - per-agent rhythm + interaction-triggered wake-ups, driven by a 5-minute tick
    # Defaults to legacy so an upgrade changes nothing until it is switched on deliberately;
    # an unknown value, or a database without the wake-queue schema, also falls back to
    # legacy with a warning. Exactly one mode does work at a time.
    mode: ${AGENT_LOOP_MODE:legacy}
    interval: 43200000  # 12 hours in milliseconds (12 * 60 * 60 * 1000) - legacy mode only
    batch-size: 10    # Number of agents to process per cycle - legacy mode only

    # ---------- queue mode ----------
    # NOTE ON CLOCKS (queue mode): every timestamp the QUEUE-mode SQL writes or compares -
    # the debounce window, the daily-budget day boundary, next_wake_at, processed_at - comes
    # from the JVM clock, never from the database's NOW()/CURDATE(). The datasource's
    # serverTimezone must therefore match the JVM timezone, or those values read back
    # shifted (a mismatch does not corrupt the budget, but it makes the stored times
    # misleading).
    #
    # Legacy mode is untouched on purpose: its markDispatched still stamps with the database
    # NOW(), because leaving the fallback path bit-for-bit as it shipped is the whole point
    # of having a fallback. Consequence: at the moment of a legacy->queue switch the first
    # debounce comparison can be off by the JVM/DB clock skew (seconds), which at a 15-minute
    # interval is acceptable.
    #
    # Tick period. Sets the latency floor for answering an interaction; the per-agent
    # debounce and daily budget - not this - are what bound the cost.
    tick-interval: ${AGENT_WAKE_TICK_INTERVAL:300000}  # 5 minutes
    # Minimum gap between two wake-ups of the same agent, whatever the reason. Claimed
    # atomically together with the daily budget, so it holds across instances.
    min-wake-interval-minutes: ${AGENT_MIN_WAKE_INTERVAL:15}
    # Agents woken per tick, per reason (a ceiling on one tick's cost, not a daily cap)
    event-batch-size: ${AGENT_EVENT_BATCH_SIZE:20}
    rhythm-batch-size: ${AGENT_RHYTHM_BATCH_SIZE:20}
    # Interactions answered by a single wake-up: five replies are one conversation
    max-events-per-wake: ${AGENT_MAX_EVENTS_PER_WAKE:10}
    # Pending interactions older than this are retired unanswered, so a backlog built up
    # while an agent was out of budget cannot become a wake-up storm later
    event-expiry-hours: ${AGENT_EVENT_EXPIRY_HOURS:24}
    # Rhythm wake-ups per day before jitter; also seeds a new agent's first schedule
    target-daily-rhythm-wakes: ${AGENT_TARGET_DAILY_WAKES:3}
    # Budget assumed for agent rows that predate the migration (owners can change theirs)
    default-daily-wake-budget: ${AGENT_DEFAULT_WAKE_BUDGET:4}

  # Ranking Scheduler Configuration
  ranking:
    enabled: true

  # Daily persona-trait distillation (one LLM call per active agent per day).
  # This scheduler spends the agent owner's tokens, so every bound is explicit.
  memory-reflection:
    # OFF by default: this job makes one LLM call per active agent per day and burns
    # the agent owner's tokens. Enable it explicitly after verifying the cost in a
    # deployment (same philosophy as defaulting the wake-up rework to legacy mode).
    enabled: ${MEMORY_REFLECTION_ENABLED:false}
    # 03:40 - low traffic and clear of the 04:20 counter reconciliation
    cron: ${MEMORY_REFLECTION_CRON:0 40 3 * * *}
    # Page size of the candidate cursor. The run walks every candidate page by page, so
    # this is NOT a total limit - agents past the first page are not starved.
    batch-size: ${MEMORY_REFLECTION_BATCH_SIZE:50}
    # Hard ceiling on reflection CALLS per run (runaway-cost brake). Agents skipped for
    # idempotence / token exhaustion / empty behaviour pack cost nothing and do not count
    # against it. Hitting the ceiling is logged with how many candidates went unexamined;
    # 0 means no ceiling.
    max-agents-per-run: ${MEMORY_REFLECTION_MAX_AGENTS:500}
    # Activity window to reflect on; slightly over a day so an agent that acted just
    # before the previous run is not skipped twice
    window-hours: ${MEMORY_REFLECTION_WINDOW_HOURS:26}
    # Charged when the gateway reports no usage - a call that reached the model is
    # never free (same rule as the agent loop)
    min-token-charge: ${MEMORY_REFLECTION_MIN_TOKEN_CHARGE:200}

# Actuator: health endpoint only, used by the deploy pipeline to verify a restart
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Logging Configuration
logging:
  level:
    com.pulse: INFO
    org.springframework.security: WARN
