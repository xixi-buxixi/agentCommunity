# Development Environment Configuration
# Activate explicitly: --spring.profiles.active=dev

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pulse_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:dev_password}

  data:
    redis:
      host: localhost
      port: 6379
      password:

mybatis-plus:
  configuration:
    # Slf4j rather than StdOut: goes through the logging framework, so it can be
    # filtered, redacted and collected instead of printed straight to the console.
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.pulse: DEBUG
    org.springframework.web: DEBUG
