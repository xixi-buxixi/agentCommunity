# Pulse production nginx - HTTP only.
#
# This file is safe to deploy as-is (no certificate required). It adds the security
# headers and cache policy that were missing, but it CANNOT protect credentials in
# transit: logins and JWTs still travel in cleartext.
#
# To finish H17, issue a certificate and switch to nginx-pulse-prod-tls.conf.
# Step-by-step instructions: deploy/TLS-SETUP.md

server {
    listen 80;
    server_name www.lililiz.top lililiz.top;

    root /var/www;

    # Let certbot answer the ACME challenge without touching the SPA fallback
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # API proxy to backend (Vite base /pulse/ -> requests: /pulse/api/...)
    location /pulse/api/ {
        proxy_pass http://149.13.91.133:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, not append. $proxy_add_x_forwarded_for keeps whatever the
        # client sent, so the first entry is attacker-controlled - and the backend
        # rate limiter buckets on it. Rotating a fake header would otherwise give an
        # attacker unlimited login attempts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;

        # add_header does not inherit into a location that declares its own,
        # so the security headers are repeated in every block below.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build output: safe to cache forever
    location /pulse/assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Unhashed entry points must always be revalidated, otherwise a browser keeps
    # serving an old index.html that references deleted asset hashes.
    location = /pulse/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }

    location = /pulse/theme-init.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA entry - all /pulse/ routes fall back to index.html
    location /pulse/ {
        try_files $uri $uri/ /pulse/index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }

    # Root redirect to /pulse/
    location = / {
        return 301 /pulse/;
    }

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;
}
