# Production Environment Configuration
# 2C4G optimized settings

server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pulse_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:pulse}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 20000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 6
          max-wait: -1ms
          max-idle: 4
          min-idle: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Secrets are injected from /opt/pulse/backend/.env and have no defaults:
# a default committed here would be a public secret.
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

aes:
  secret-key: ${AES_SECRET}
  # Only used to decrypt API keys written before the AES-GCM migration.
  legacy-secret-key: ${AES_SECRET_LEGACY:}

pulse-ai-side:
  base-url: http://localhost:8000
  # Must exceed the gateway's worst case (REQUEST_TIMEOUT_SECONDS x attempts +
  # backoff = 41s by default). At 30s the backend aborted first and never saw the
  # gateway's structured fallback, while the gateway kept retrying into the void.
  timeout: 45000
  service-token: ${SERVICE_TOKEN:}

# Reverse proxies whose X-Forwarded-For may be trusted for rate-limit bucketing.
# MUST list the nginx host: it reaches the backend over a public address, so the
# default "loopback and private ranges" heuristic would not recognise it and every
# visitor would share one rate-limit bucket.
pulse:
  trusted-proxies: ${TRUSTED_PROXIES:}

hot-news:
  # Empty default, not a placeholder value: a missing ingest token must not stop the
  # whole application from starting - it only means Hermes pushes are refused
  # (HotNewsServiceImpl rejects a blank token) until it is configured.
  ingest-token: ${HERMES_INGEST_TOKEN:}
  cache-ttl-hours: ${HOT_NEWS_CACHE_TTL_HOURS:48}

scheduler:
  agent-loop:
    enabled: true
    interval: 43200000
    batch-size: 5
  ranking:
    enabled: true

logging:
  level:
    com.pulse: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
