name: Deploy to Servers

on:
  push:
    branches: [main, bounty]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      aiside: ${{ steps.filter.outputs.aiside }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'pulse-frontend/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'pulse-backend/**'
              - 'deploy/backend/**'
              - '.github/workflows/deploy.yml'
            aiside:
              - 'pulse-ai-side/**'
              - '.github/workflows/deploy.yml'

  # Test gate. Deploys used to run straight from `mvn package -DskipTests`, so no
  # test ever ran in CI; a broken money path or security rule could reach
  # production unchallenged.
  test-backend:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Unit tests
        run: cd pulse-backend && mvn -B test

  test-aiside:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.aiside == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pulse-ai-side/requirements.txt
      - name: Install dependencies
        run: cd pulse-ai-side && pip install -r requirements.txt
      - name: Lint (ruff)
        run: cd pulse-ai-side && ruff check .
      - name: Tests (pytest)
        run: cd pulse-ai-side && pytest

  test-frontend:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pulse-frontend/package-lock.json
      - name: Install dependencies
        run: cd pulse-frontend && npm ci
      - name: Lint
        run: cd pulse-frontend && npm run lint
      - name: Unit tests
        run: cd pulse-frontend && npm test

  deploy-frontend:
    needs: [changes, test-frontend]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pulse-frontend/package-lock.json
      - name: Build
        run: cd pulse-frontend && npm ci && npm run build
      - name: Test SSH connectivity (Tencent)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes -o ServerAliveInterval=30 -i ~/.ssh/deploy_key root@${{ secrets.TENCENT_HOST }} "echo SSH_OK" 2>&1 || echo "SSH_FAILED"
        continue-on-error: true
      - name: Clean old assets
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          script: rm -rf /var/www/pulse/assets /var/www/pulse/index.html
      - name: Upload to Tencent
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: pulse-frontend/dist/*
          target: /var/www/pulse/
          strip_components: 2
      - name: Fix permissions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          script: chmod -R 755 /var/www/pulse/

  deploy-backend:
    needs: [changes, test-backend]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build
        run: cd pulse-backend && mvn clean package -DskipTests -B
      - name: Test SSH connectivity (Qiniuyun)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes -o ServerAliveInterval=30 -i ~/.ssh/deploy_key root@${{ secrets.QINIUYUN_HOST }} "echo SSH_OK" 2>&1 || echo "SSH_FAILED"
        continue-on-error: true
      - name: Upload JAR + config to Qiniuyun
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.QINIUYUN_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "pulse-backend/target/pulse-backend-1.0.0-SNAPSHOT.jar,deploy/backend/application-prod.yml,deploy/backend/.env.example"
          target: /opt/pulse/backend/
          strip_components: 2
      - name: Upload schema.sql
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.QINIUYUN_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: pulse-backend/src/main/resources/schema.sql
          target: /opt/pulse/backend/
          strip_components: 3
      - name: Apply schema migration
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.QINIUYUN_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            # Load .env robustly.
            #
            # The previous `export $(cat .env | xargs)` breaks on the comment lines
            # that .env.example ships with: dash stops at the first invalid
            # identifier ("#"), so NOTHING was exported - and 2>/dev/null hid it.
            # That was survivable while every placeholder in application.yml had a
            # default; once the secrets became mandatory it meant the JVM died with
            # "Could not resolve placeholder 'JWT_SECRET'".
            load_env() {
              [ -f "$1" ] || return 0
              while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in ''|'#'*) continue ;; esac
                key=${line%%=*}
                value=${line#*=}
                value=$(printf '%s' "$value" | tr -d '\r')
                case "$key" in
                  ''|*[!A-Za-z0-9_]*) continue ;;
                esac
                export "$key=$value"
              done < "$1"
            }
            load_env /opt/pulse/backend/.env
            if [ -z "$DB_PASSWORD" ]; then
              echo "DB_PASSWORD is not set in /opt/pulse/backend/.env - cannot migrate or start"
              exit 1
            fi

            # --force so that statements needing privileges this user may not have
            # (CREATE DATABASE) do not abort the rest of the file. Its exit code is
            # deliberately ignored here - the explicit verification below is what
            # gates the deploy, and that way this step behaves the same whether or
            # not the remote shell runs with -e.
            mysql -u pulse -p"${DB_PASSWORD}" --force pulse_db < /opt/pulse/backend/schema.sql \
              || echo "mysql reported errors above; the verification below decides"

            # ...but the objects the application now depends on are then verified
            # explicitly. Previously this step was continue-on-error AND swallowed
            # mysql's exit code with `|| echo`, so a failed migration still reported
            # success and the app ran against a schema without shedlock / hot_score /
            # last_dispatched_at - scheduled jobs failing while health stayed UP.
            missing=""
            check() {
              count=$(mysql -u pulse -p"${DB_PASSWORD}" -N -B pulse_db -e "$2" 2>/dev/null | head -1)
              [ "$count" = "1" ] || missing="$missing $1"
            }
            check "table:shedlock" "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='shedlock'"
            check "column:posts.hot_score" "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='posts' AND COLUMN_NAME='hot_score'"
            check "column:agents.last_dispatched_at" "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='agents' AND COLUMN_NAME='last_dispatched_at'"

            if [ -n "$missing" ]; then
              echo "=============================================================="
              echo "WARNING: optional schema objects are missing:$missing"
              echo ""
              echo "Most likely the '$USER' database user has no ALTER/CREATE grant."
              echo "The application detects this at startup (SchemaCapabilities) and"
              echo "runs documented fallbacks, so the deploy continues - but the"
              echo "indexed paths and scheduler locking stay off until you run:"
              echo "  mysql -u root -p pulse_db < deploy/migrations/2026-07-27-optimization.sql"
              echo "=============================================================="
            else
              echo "Schema migration verified: all objects present"
            fi
      - name: Restart backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.QINIUYUN_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 8m
          script: |
            pkill -f 'pulse-backend.*\.jar' || true
            sleep 3
            mkdir -p /opt/pulse/logs /opt/pulse/backend
            ENV_FILE=/opt/pulse/backend/.env
            [ -f "$ENV_FILE" ] || cp /opt/pulse/backend/.env.example "$ENV_FILE" 2>/dev/null || true
            touch "$ENV_FILE"

            # The application no longer carries default secrets, so any secret that is
            # missing or still a public placeholder is generated here once and then kept.
            ensure_secret() {
              key="$1"
              cur=$(grep "^${key}=" "$ENV_FILE" 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '\r')
              case "$cur" in
                ""|change_me|changeme|change_this*|your_*|Pulse*)
                  if [ "$key" = "AES_SECRET" ] && ! grep -q "^AES_SECRET_LEGACY=..*" "$ENV_FILE" 2>/dev/null; then
                    legacy="$cur"
                    [ -z "$legacy" ] && legacy='PulseAES256SecretKey!'
                    sed -i "/^AES_SECRET_LEGACY=/d" "$ENV_FILE"
                    printf '%s\n' "AES_SECRET_LEGACY=$legacy" >> "$ENV_FILE"
                    echo "  -> stored previous AES key as AES_SECRET_LEGACY (existing API keys stay decryptable)"
                  fi
                  sed -i "/^${key}=/d" "$ENV_FILE"
                  printf '%s\n' "${key}=$(openssl rand -hex 32)" >> "$ENV_FILE"
                  echo "${key}: generated a new value (stored only in $ENV_FILE)"
                  [ "$key" = "JWT_SECRET" ] && echo "  -> existing sessions are invalidated, users must log in again"
                  [ "$key" = "HERMES_INGEST_TOKEN" ] && echo "  -> ACTION REQUIRED: copy the new token to the Hermes publisher"
                  ;;
                *)
                  echo "${key}: already configured"
                  ;;
              esac
            }
            ensure_secret JWT_SECRET
            ensure_secret AES_SECRET
            ensure_secret HERMES_INGEST_TOKEN
            # Shared with the AI gateway, which now refuses to start without it
            ensure_secret SERVICE_TOKEN

            # The nginx host reaches the backend over a public address, so it must be
            # named explicitly before its X-Forwarded-For is believed (rate limiting).
            sed -i "/^TRUSTED_PROXIES=/d" "$ENV_FILE"
            printf '%s\n' "TRUSTED_PROXIES=${{ secrets.TENCENT_HOST }}" >> "$ENV_FILE"

            chmod 600 "$ENV_FILE"
            grep -q "^DB_PASSWORD=..*" "$ENV_FILE" || echo "WARNING: DB_PASSWORD is empty in $ENV_FILE - the backend cannot start without it"

            # Load .env robustly.
            #
            # The previous `export $(cat .env | xargs)` breaks on the comment lines
            # that .env.example ships with: dash stops at the first invalid
            # identifier ("#"), so NOTHING was exported - and 2>/dev/null hid it.
            # That was survivable while every placeholder in application.yml had a
            # default; once the secrets became mandatory it meant the JVM died with
            # "Could not resolve placeholder 'JWT_SECRET'".
            load_env() {
              [ -f "$1" ] || return 0
              while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in ''|'#'*) continue ;; esac
                key=${line%%=*}
                value=${line#*=}
                value=$(printf '%s' "$value" | tr -d '\r')
                case "$key" in
                  ''|*[!A-Za-z0-9_]*) continue ;;
                esac
                export "$key=$value"
              done < "$1"
            }
            load_env "$ENV_FILE"

            for required in DB_PASSWORD JWT_SECRET AES_SECRET HERMES_INGEST_TOKEN; do
              eval "value=\$$required"
              if [ -z "$value" ]; then
                echo "FATAL: $required is empty after loading $ENV_FILE"
                exit 1
              fi
            done
            echo "Environment loaded: $(grep -c '^[A-Za-z_]*=' "$ENV_FILE") variables"

            JAR=/opt/pulse/backend/pulse-backend-1.0.0-SNAPSHOT.jar
            PREVIOUS=/opt/pulse/backend/pulse-backend-previous.jar

            start_backend() {
              nohup java -Xms512m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 \
                -jar "$1" \
                --spring.profiles.active=prod \
                > /opt/pulse/logs/backend.log 2>&1 &
              # Spring Boot on a 2C4G box needs well over the old zero-wait assumption
              for i in $(seq 1 36); do
                if curl -fsS --max-time 3 http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
                  echo "  healthy after $((i * 5))s"
                  return 0
                fi
                sleep 5
              done
              return 1
            }

            echo "Starting new build..."
            if start_backend "$JAR"; then
              # Keep this build as the rollback target for the next deploy
              cp -f "$JAR" "$PREVIOUS"
              echo "Backend restarted and healthy"
              exit 0
            fi

            echo "=============================================================="
            echo "New build did not become healthy within 180s. Last log lines:"
            tail -60 /opt/pulse/logs/backend.log
            echo "=============================================================="

            pkill -f 'pulse-backend.*\.jar' || true
            sleep 3
            if [ -f "$PREVIOUS" ]; then
              echo "Rolling back to the previous build to restore service..."
              if start_backend "$PREVIOUS"; then
                echo "ROLLED BACK: the previous build is serving again."
              else
                echo "ROLLBACK FAILED - the service is down. Last log lines:"
                tail -60 /opt/pulse/logs/backend.log
              fi
            else
              echo "No previous build on disk (first deploy with rollback support),"
              echo "so there is nothing to roll back to. The service is down."
            fi
            exit 1

  deploy-aiside:
    needs: [changes, test-aiside]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.aiside == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source to Qiniuyun
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.QINIUYUN_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: pulse-ai-side
          target: /opt/pulse/ai-side/
          strip_components: 1
      - name: Install deps + Restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.QINIUYUN_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 8m
          script: |
            cd /opt/pulse/ai-side || exit 1

            # Use the venv's interpreter directly instead of `. venv/bin/activate`:
            # activate is a bash-ism-heavy script and its failure is easy to miss,
            # which is how a broken environment previously slipped through.
            if [ ! -x venv/bin/python ]; then
              echo "venv missing, creating it"
              python3 -m venv venv || { echo "cannot create venv"; exit 1; }
            fi

            # No "|| true": a failed dependency install used to be swallowed and the
            # service then restarted against a stale or incomplete environment.
            venv/bin/python -m pip install -q --upgrade pip || exit 1
            venv/bin/python -m pip install -q -r requirements.txt || {
              echo "dependency install failed; leaving the running service untouched"
              exit 1
            }

            # The gateway now fails closed on a missing SERVICE_TOKEN. It must match
            # the backend's value, which lives in the backend .env on this same host.
            BACKEND_ENV=/opt/pulse/backend/.env
            AI_ENV=/opt/pulse/ai-side/.env
            mkdir -p /opt/pulse/backend
            touch "$BACKEND_ENV" "$AI_ENV"
            TOKEN=$(grep "^SERVICE_TOKEN=" "$BACKEND_ENV" 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '\r')
            if [ -z "$TOKEN" ]; then
              TOKEN=$(openssl rand -hex 32)
              sed -i "/^SERVICE_TOKEN=/d" "$BACKEND_ENV"
              printf '%s\n' "SERVICE_TOKEN=$TOKEN" >> "$BACKEND_ENV"
              echo "Generated SERVICE_TOKEN into $BACKEND_ENV (restart the backend to pick it up)"
            fi
            sed -i "/^SERVICE_TOKEN=/d" "$AI_ENV"
            printf '%s\n' "SERVICE_TOKEN=$TOKEN" >> "$AI_ENV"
            chmod 600 "$AI_ENV"

            pkill -f 'uvicorn.*app.main:app' || true
            sleep 2
            mkdir -p /opt/pulse/logs
            # Bind to loopback: the gateway receives decrypted API keys and has no
            # public route in front of it. Change only together with a firewall rule.
            nohup venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 \
              --log-level info > /opt/pulse/logs/ai-side.log 2>&1 &
            sleep 4
            # Startup now fails on invalid configuration, so verify instead of assuming
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health > /dev/null; then
              echo "AI Side restarted and healthy"
            else
              echo "AI Side failed its health check - last log lines:"
              tail -30 /opt/pulse/logs/ai-side.log
              exit 1
            fi
